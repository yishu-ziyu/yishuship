<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>版本四 · 左目录右内容</title><link rel="stylesheet" href="common.css"><style>
body{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;background:#efede4}
aside .p{font-family:var(--serif);font-size:20px;padding:0 8px 12px}
aside a.s{display:flex;justify-content:space-between;padding:7px 8px;border-radius:7px;font-size:14px} aside a.s:hover{background:#e5e2d6} aside a.s.on{background:var(--ink);color:var(--paper)}
aside a.s span{color:var(--faint);font-size:12px} aside a.s.on span{color:#bdbab0}
aside .sub{margin:2px 0 8px 10px;border-left:1px solid var(--line);overflow:hidden;animation:fade .25s var(--ease)}
aside .sub a{display:block;padding:5px 10px;font-size:12.5px;color:var(--grey);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} aside .sub a:hover{color:var(--ink)} aside .sub a.on{color:var(--accent);font-weight:600}
main{padding:30px 48px 80px;max-width:900px}
.ov h1{font-size:30px} .ov p{color:var(--grey);margin:6px 0 24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats a{padding:16px 14px;border-right:1px solid var(--line)} .stats a:nth-child(3n){border-right:0} .stats a:nth-child(-n+3){border-bottom:1px solid var(--line)}
.stats a:hover{background:var(--card)} .stats b{font-family:var(--serif);font-size:26px;font-weight:600;display:block} .stats span{font-size:12.5px;color:var(--grey)}
.grp h3{font-family:var(--sans);font-size:13px;color:var(--grey);font-weight:500;margin:22px 0 4px}
.row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line)} .row:hover{background:var(--card)} .row .id{color:var(--faint);font-size:12px} .row .l{display:block;color:var(--grey);font-size:13px}
</style></head><body><aside id="nav"></aside><main id="app"></main><div class="vtag">版本四 · 左目录右内容 · <a href="/">换一版</a></div><script src="common.js"></script><script>
const nav=r=>{const cur=r.id?I(r.id).type:r.type;
 return `<div class="p">${esc(D.project)}</div><a class="s${!cur?" on":""}" href="#/">概览</a>`+D.order.map(t=>`<a class="s${t===cur?" on":""}" href="${href(t)}">${t}<span>${ofType(t).length}</span></a>`+
  (t===cur?`<div class="sub">${groups(t).flatMap(([,a])=>a).slice(0,40).map(i=>`<a class="${i.id===r.id?"on":""}" href="${href(t,i.id)}" title="${esc(i.title)}">${esc(i.title)}</a>`).join("")}</div>`:"")).join("")};
const ov=()=>`<div class="ov fade"><h1>${esc(D.project)}</h1><p>${esc(D.what)}</p><div class="stats">${D.order.map(t=>`<a href="${href(t)}"><b>${ofType(t).length}</b>${t}<br><span>${summary(t)}</span></a>`).join("")}</div></div>`;
const list=t=>`<div class="fade">${crumb({type:t},"概览")}<h1 style="font-size:26px;margin:8px 0 2px">${t}</h1><p style="color:var(--grey)">${summary(t)}</p>
 ${groups(t).map(([n,xs])=>`<div class="grp"><h3>${n} · ${xs.length}</h3>${xs.map(i=>`<a class="row" href="${href(t,i.id)}"><span class="id">${esc(i.id)}</span><span>${esc(i.title)}<span class="l">${esc(lead(i))}</span></span>${st(i)}</a>`).join("")}</div>`).join("")}</div>`;
boot(r=>{nav_=document.getElementById("nav");nav_.innerHTML=nav(r);app.innerHTML=r.id?`<div class="fade">${detail(r.id)}</div>`:r.type?list(r.type):ov()});
</script></body></html>
